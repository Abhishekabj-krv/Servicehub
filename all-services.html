<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Services - ServiceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #1A1A2E;
            --light: #F7F7F7;
            --white: #FFFFFF;
            --text: #2D3748;
            --text-light: #718096;
            --success: #48BB78;
            --gradient: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: var(--light);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: var(--white);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.05) 0%, rgba(78, 205, 196, 0.05) 100%);
            padding: 3rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Filter Section */
        .filter-section {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .filter-tab {
            padding: 0.8rem 2rem;
            background: var(--white);
            border: 2px solid var(--light);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: var(--text);
        }

        .filter-tab:hover,
        .filter-tab.active {
            background: var(--gradient);
            color: var(--white);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Services Grid */
        .services-container {
            max-width: 1280px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .service-header {
            display: flex;
            align-items: start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .service-icon {
            font-size: 3rem;
        }

        .service-info h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.3rem;
        }

        .service-category {
            display: inline-block;
            background: rgba(78, 205, 196, 0.1);
            color: var(--secondary);
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .service-description {
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }

        .service-features {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .service-features li {
            padding: 0.4rem 0;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .service-features li::before {
            content: '✓';
            color: var(--success);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .contact-section {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1) 0%, rgba(78, 205, 196, 0.1) 100%);
            padding: 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
        }

        .contact-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            font-weight: 500;
            text-align: center;
        }

        .contact-number {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            text-align: center;
            transition: color 0.3s ease;
        }

        .contact-number:hover {
            color: var(--primary-dark);
        }

        .call-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .call-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        /* Footer */
        footer {
            background: var(--dark);
            color: var(--white);
            padding: 2rem;
            margin-top: 5rem;
            text-align: center;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .filter-tabs {
                gap: 0.5rem;
            }

            .filter-tab {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <a href="index.html" class="back-btn">
                ← Back to Home
            </a>
            <a href="index.html" class="logo">ServiceHub</a>
        </nav>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <h1>All Our Services</h1>
        <p>Browse through all our professional services across categories</p>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterServices('all')">All Services</button>
            <button class="filter-tab" onclick="filterServices('home')">🏠 Home</button>
            <button class="filter-tab" onclick="filterServices('wedding')">💒 Wedding</button>
            <button class="filter-tab" onclick="filterServices('repair')">🔧 Repair</button>
            <button class="filter-tab" onclick="filterServices('professional')">💼 Professional</button>
        </div>
    </section>

    <!-- Services Grid -->
    <section class="services-container">
        <div class="services-grid" id="servicesGrid">
            <!-- Services will load here -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 ServiceHub. All rights reserved. Made with ❤️ in Karnataka</p>
    </footer>
    <script src="all-service.js"></script>
</body>
</html>
